[package]
name = "rust-message-box"
version = "0.4.2"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8", features = ["d1"] }
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "js"] }

# FCM v1 JWT signing (RS256, PKCS#8 PEM parsing) — in-WASM RSA signing path.
# sha2 needs the `oid` feature so it implements AssociatedOid, which
# Pkcs1v15Sign::new::<Sha256>() requires.
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
pkcs8 = { version = "0.10", features = ["pem"] }

# S3 v4 presigning for R2 uploads larger than the Workers 100 MB body cap.
hmac = "0.12"

# BSV
# The BRC-31 layer (0.5.0: on bsv-middleware-core 0.2.0 and bsv-rs 0.4). Its
# session, wallet and auth message are the relay's own bsv-rs 0.4.1 types.
bsv-middleware-cloudflare = "0.5.0"
# The SDK and the streaming BEEF reader (0.4.0: `verify_stream`, `BeefDecoder`,
# `StreamVerifier`, `Cursor`; 0.4.1: a transaction with no input is invalid
# bytes, `Kind::NoInputs`). Pinned exactly: the door reads the subject's offset
# out of the cursor's bytes (`beef_door::tip_of`), a layout of this release.
bsv-rs = { version = "=0.4.1", features = ["auth", "wallet", "transaction", "wasm"] }
# The shared payment check (P0-3): the six-word verdict, the BRC-29 script and
# the header service as a trait. 0.4.1 is on bsv-rs 0.4.1, so the words take
# the relay's own wallet and reader types. The door keeps its own reading (the
# cursor at rest) and asks the middleware the output check on the subject
# alone (`verify_payment_output_only`).
bsv-middleware-rs = "0.4.1"
# The header service is a trait of bsv-middleware-rs (`HeaderService`),
# declared with async-trait; the box implements it over the HEADER_SERVICE
# service binding or the Worker fetch of a URL.
async-trait = "0.1"
# `StreamExt::next` on the R2 object's body stream (`worker::ByteStream`).
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
# Test-only RNG for generating ephemeral RSA test keys. Not used at runtime.
rand = "0.8"
# Dev-only: the ack statements are planned and executed on a real SQLite with the
# real migrations (retention.rs tests). Never compiled into the worker.
rusqlite = { version = "0.32", features = ["bundled", "limits"] }

# 2026-07-23 (#249): the 429-fix (lazy + best-effort BRC-31 session-liveness
# touch) is NOW in PUBLISHED bsv-middleware-cloudflare 0.3.0 — the dep above is
# `= "0.3"` and resolves it straight from crates.io, matching the tower
# (workers/low-watchtower, also "0.3", no patch). NO [patch.crates-io]: the old
# patch pinned a local path against a `= "0.2"` dep, but the local crate had
# advanced to 0.3.1 (not ^0.2) → cargo silently marked the patch UNUSED and
# resolved registry 0.2.0 (the PRE-fix crate) — the fix was written but never
# shipped for weeks (a dead-patch silent regression). Published 0.3.0 alone
# removes the 429→500 trigger + adds BRC-104 replay protection. Any further
# hardening (the bounded KV read-retry) ships as a published 0.3.2, never a
# local path-patch. WS-1: public bsv-middleware-cloudflare is the canonical lineage.

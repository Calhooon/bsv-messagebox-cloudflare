name = "rust-message-box"
main = "build/worker/shim.mjs"
compatibility_date = "2026-04-07"
# account_id = "<your-cloudflare-account-id>"

# TODO: Set custom domain after initial deploy
# routes = [
#   { pattern = "message-box.calhouninfra.com", custom_domain = true }
# ]

[vars]
BSV_NETWORK = "mainnet"
WALLET_STORAGE_URL = "https://wallet-infra.x402agency.com"
# The header service the delivery payment's merkle roots are checked against
# (0.3.29) is named one of two ways, and neither is set here: a deployment names
# its own, and until it does every payment that owes a delivery fee is refused
# 500 ERR_SERVER_MISCONFIGURED (fail closed).
#   - The HEADER_SERVICE service binding (0.3.30), the [[services]] block below.
#     A Worker on the same Cloudflare account as the header service must use the
#     binding: Cloudflare refuses a plain fetch between two Workers of one
#     account (error 1042 behind a 404, the callee never invoked).
#   - HEADER_SERVICE_URL, a var. A Worker elsewhere may use the URL.
# The binding wins when both exist.
# The broadcaster a verified payment's subject is announced to (0.4.4,
# bsv-low #591 M2): ARC_URL names an ARC (its /v1/tx takes the BEEF as bytes);
# the ARC_API_KEY secret, when set, is its bearer token. Not set here: a
# deployment names its own. With none named the relay announces nothing and
# each paid row says so ("announced": no broadcaster is configured). The
# broadcaster's word is a hint: delivery never waits on it, and a word that is
# not an acceptance is asked again by the scheduled drain (announce_owed,
# migration 0005).
# ARC_URL = "https://arc.example"
# The per-identity send budget on /sendMessage (0.4.4, bsv-low #591 M3): at
# most SEND_BUDGET_SENDS sends (default 100, one listing of a box) and
# SEND_BUDGET_BYTES bytes of message and payment text no delivery fee judges
# (default 4194304, one payment body of 0.3.28) per identity in each window of
# SEND_BUDGET_WINDOW_SECS (default 60); the next is 429 ERR_SEND_BUDGET naming
# the window (send_budget table, migration 0006).
# SEND_BUDGET_SENDS = "100"
# Flip to "true" after setting the FIREBASE_SERVICE_ACCOUNT_JSON secret.
ENABLE_FIREBASE = "false"
# The ICE credentials of a WebRTC hand (POST /turn-credentials and its revoke,
# migration 0010). TURN_CREDENTIALS is the one switch: "on" enables the two
# routes, anything else answers 403 and charges nothing. TURN_KEY_ID is the
# Cloudflare Realtime TURN key's id (an identifier: the operator's own config
# names it, never this file); its API token is the TURN_KEY_API_TOKEN secret.
# The ttl asked of Cloudflare is TURN_TTL_SECONDS, at most 172800 (48 hours).
# Each mint is charged, before Cloudflare is asked and all or none, to four
# hourly budgets: the authenticated identity's, the source group's (an IPv4
# address or an IPv6 /64, from CF-Connecting-IP), the IPv6 /48's and the
# Worker's; the first spent is refused 429 ERR_TURN_BUDGET naming it.
TURN_CREDENTIALS = "off"
TURN_KEY_ID = "<your-turn-key-id>"
TURN_TTL_SECONDS = "3600"
TURN_BUDGET_IDENTITY_HOUR = "6"
TURN_BUDGET_SOURCE_HOUR = "6"
TURN_BUDGET_PREFIX48_HOUR = "24"
TURN_BUDGET_TOTAL_HOUR = "600"

# The header service over a service binding (0.3.30). `rust-chaintracks` is the
# one deployment of the header service; it is production, and there is no beta
# header service.
# [[services]]
# binding = "HEADER_SERVICE"
# service = "rust-chaintracks"

# Secrets (set via `wrangler secret put`):
#   SERVER_PRIVATE_KEY            — 64-char hex BRC-31 server identity key.
#   TURN_KEY_API_TOKEN: the Cloudflare TURN key's API token; only required
#                       when TURN_CREDENTIALS = "on". Read with env.secret,
#                       sent to Cloudflare alone, never logged or answered.
#   FIREBASE_SERVICE_ACCOUNT_JSON — Full Google service-account JSON (for FCM).
#                                   Only required when ENABLE_FIREBASE = "true".
#   R2_ACCESS_KEY_ID              — R2 S3 access key for presigning BEEF uploads.
#   R2_SECRET_ACCESS_KEY          — R2 S3 secret.
#   R2_ACCOUNT_ID                 — Cloudflare account ID (for the R2 S3 host).
#   ARC_API_KEY: optional, the bearer token for ARC_URL (0.4.4).
# And the plain [vars] R2_BUCKET_NAME should match the [[r2_buckets]].bucket_name.

R2_BUCKET_NAME = "bsv-messagebox-beefs"

[build]
command = "worker-build --release"

# R404-H1, bsv-rs 0.4.5: a LOCAL work budget inside each input.
# Native release, whole door including parsing: the widest budget-boundary
# witness observed 1127.292 ms. The retained between-input slice reached
# 9811 ms, so use that larger stretch. The 0.4.4 V8 estimate is 1.2 times native:
# (15000 + 11193 * 1.2) * 1.5 = 42647.4 ms, rounded up to 43000 (the widest
# stretch measured: 11,193 ms in the keeper's verification at the tip; 9,811 ms in the lane's).
# Not measured in workerd. Count and weight slices between inputs stay.
[limits]
cpu_ms = 43000
# Relay build-time work budget per input. Rebuild when changing it.
work_units = 10000000

[[d1_databases]]
binding = "DB"
database_name = "rust-message-box-prod"
database_id = "<your-d1-database-id>"

[[kv_namespaces]]
binding = "AUTH_SESSIONS"
id = "<your-kv-namespace-id>"

# R2 bucket used by /beef/upload-url + sendMessage to handle BEEFs larger
# than the 100 MB Workers body cap. Clients upload via presigned URL (S3 v4
# signed in-WASM via r2_presign.rs), server fetches by key via this binding.
# Since 0.4.0 a paid message's BEEF stays at rest here: the recipient's D1 row
# carries the key and never the bytes, and a deferred delivery fee names them
# (the fee_internalize table, migration 0003). A lifecycle rule on this bucket
# must not expire an object a row or a deferred fee still names; the relay
# deletes an object itself, and only when no stored row (messages.beef_key,
# migration 0004) and no deferred fee names its key.
#
# Since 0.4.4 (bsv-low #591 L3) every key the relay mints (an upload URL, an
# inline spool) is recorded with a deadline (the URL's life and a day,
# beef_minted, migration 0008), and the scheduled event deletes, past it, an
# object nothing names. The door's own states live under the prefix
# door-state/: give the bucket an object lifecycle rule that expires that
# prefix (seven days is ample: a reading pending longer has been abandoned),
# and no other rule.
[[r2_buckets]]
binding = "BEEF_BLOBS"
bucket_name = "bsv-messagebox-beefs"

# The drain of the deferred delivery fees runs on the scheduled event. A fee
# is deferred when its BEEF is more than one request hands wallet-infra, or
# when wallet-infra could not answer; the message is delivered either way.
# The drain hands wallet-infra a reference to the object (beefAtRest), whose
# bucket is R2_BUCKET_NAME: wallet-infra binds the same bucket to read it.
# The same event reclaims the payment objects that acknowledged, purged or
# expired rows have let go of (beef_released), 25 a firing.
# With no cron no deferred fee is ever recorded and no object is reclaimed. A deployment sets its own
# cadence (every minute here); the transcript-retention sweep shares the
# event and is a no-op without RETAIN_BOX_PREFIXES.
#
# [triggers]
# crons = ["* * * * *"]

# MessageHub — per-identity hibernatable WebSocket DO (M9). Routing via
# idFromName(identity_key); WS lifecycle and event surface land in
# downstream M9 issues. Deliberately a new class name (not MessageRoom)
# to avoid collision with the v2 deletion.
[[durable_objects.bindings]]
name = "MESSAGE_HUB"
class_name = "MessageHub"

# EngineIoSession — per-sid Engine.IO + Socket.IO transport state (M10
# Phase A — issue #61). Routing via idFromName(sid). Holds polling
# buffer + transport state (polling vs websocket) + pending packets.
# Phase A is auth-less; Phase B layers BRC-103 over the authMessage
# Socket.IO event.
[[durable_objects.bindings]]
name = "ENGINEIO_SESSION"
class_name = "EngineIoSession"

# Durable Object migrations — required so Cloudflare knows what classes
# exist across versions. v1 created MessageRoom (WebSocket rooms); v2
# removed it when we dropped WebSocket to match go-messagebox-server
# scope; v3 introduces MessageHub for the M9 hibernatable-WS rebuild.
[[migrations]]
tag = "v1"
new_classes = ["MessageRoom"]

[[migrations]]
tag = "v2"
deleted_classes = ["MessageRoom"]

[[migrations]]
tag = "v3"
new_classes = ["MessageHub"]

[[migrations]]
tag = "v4"
new_classes = ["EngineIoSession"]


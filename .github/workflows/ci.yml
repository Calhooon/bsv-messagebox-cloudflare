# Shared Worker gate: PR head, read-only token, pinned Rust, cached cargo.
# Host clippy covers all targets; wasm clippy covers libraries because SQLite dev tests are native.
name: ci
'on':
  pull_request: null
  workflow_call: null
  push:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: . -> target
    - run: cargo test --locked --no-fail-fast
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: . -> target
    - run: cargo fmt --all -- --check
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: . -> target
    - run: cargo clippy --locked --all-targets -- -D warnings
    - run: cargo clippy --locked --target wasm32-unknown-unknown --lib -- -D warnings
  wasm32:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: . -> target
    - run: cargo build --locked --release --target wasm32-unknown-unknown --lib
  scrub:
    name: scrub
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Scrub the tree and every commit's added lines since the base (since the previous release tag on a tag)
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        base="${BASE_SHA:-}"
        if [ "${REF_TYPE:-}" = tag ]; then
          base=--tag
        elif [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          base=--all
        fi
        tools/scrub.sh "$base"

# Publishes bsv-messagebox-cloudflare to crates.io from a v* tag through
# crates.io trusted publishing (no token is stored anywhere). The tag's version
# must equal the manifest's, the tagged commit must be on main, and the shared
# gate (ci.yml) must pass first. The crate builds natively (the cdylib + rlib
# library compiles on the host), so the package is verified with a host
# `cargo publish --dry-run`; ci.yml carries the wasm32 clippy and release build.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check version and main ancestry
        run: |
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "tag must equal the manifest's version"
          print(f"release version: {version}")
          PY
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: '1.95.0'
      - name: Verify package
        run: cargo publish --dry-run
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish (skipped when the index already holds this version, so a re-run of the tag's workflow stays green)
        run: |
          NAME=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import sys,json; print(json.load(sys.stdin)["packages"][0]["name"])')
          VERSION="${GITHUB_REF_NAME#v}"
          if curl -fsS "https://crates.io/api/v1/crates/$NAME/$VERSION" -A "$NAME release workflow" >/dev/null 2>&1; then
            echo "$NAME $VERSION is already on crates.io; nothing to publish"
          else
            cargo publish
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
